<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Editor Sandbox</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            height: 100vh;
            margin: 0;
        }

        #sidebar {
            width: 300px;
            background-color: #34495e;
            padding: 20px;
            overflow-y: auto;
            border-right: 2px solid #2c3e50;
        }

        #main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            position: relative;
        }

        #grid-container {
            display: grid;
            gap: 2px;
            background-color: #7f8c8d;
            padding: 5px;
            border: 2px solid #bdc3c7;
        }

        .cell {
            width: 50px;
            height: 50px;
            background-color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            color: #333;
        }

        .cell:hover {
            opacity: 0.8;
        }

        .tool-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            border: none;
            background-color: #2ecc71;
            color: white;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
        }

        .tool-btn:hover {
            background-color: #27ae60;
        }

        .tool-btn.active {
            background-color: #f1c40f;
            color: #333;
        }

        h2 {
            margin-top: 0;
        }

        .control-group {
            margin-bottom: 20px;
            border-bottom: 1px solid #7f8c8d;
            padding-bottom: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        #save-status {
            margin-top: 10px;
            color: #f1c40f;
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <h2>Map Editor</h2>

        <div class="control-group">
            <label>Map Type (Filename)</label>
            <select id="map-type">
                <option value="easy">Easy (7x7)</option>
                <option value="hard">Hard (14x10)</option>
                <option value="multi_coop">Multi Co-op</option>
                <option value="custom">Custom</option>
            </select>

            <div id="recipe-theme-group"
                style="display:none; margin-top:10px; border-top:1px solid #7f8c8d; padding-top:10px;">
                <label>Recipe Theme (Easy Mode)</label>
                <select id="recipe-theme">
                    <option value="soup_salad">🥗 Soup & Salad (4 Ings)</option>
                    <option value="burger_salad">🍔 Burger & Salad (5 Ings)</option>
                    <option value="pizza_soup">🍕 Pizza & Soup (5 Ings)</option>
                    <option value="breakfast">🍳 Omelette & Toast (4 Ings)</option>
                </select>
                <small style="color:#bdc3c7; display:block; margin-top:5px; font-size:12px;">Only ingredients for these
                    dishes will be available below.</small>
            </div>

            <label>Width</label>
            <input type="number" id="grid-w" value="7" min="4" max="20">

            <label>Height</label>
            <input type="number" id="grid-h" value="7" min="4" max="20">

            <button id="resize-btn" class="tool-btn" style="background-color: #3498db;">New / Resize Grid</button>
            <button id="manage-maps-btn" class="tool-btn" style="background-color: #8e44ad;">📂 Manage Maps</button>
            <button id="save-btn" class="tool-btn" style="background-color: #e74c3c;">Save Current Map</button>
            <div id="save-status"></div>
        </div>

        <div id="maps-modal"
            style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:300px; background:#34495e; padding:20px; border:2px solid #bdc3c7; z-index:100; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            <h3>Saved Maps</h3>
            <div id="maps-list"
                style="max-height:200px; overflow-y:auto; margin-bottom:15px; border:1px solid #7f8c8d;">
                <!-- List items will be injected here -->
            </div>
            <button id="close-modal-btn"
                style="width:100%; padding:8px; background:#e74c3c; color:white; border:none; cursor:pointer;">Close</button>
        </div>

        <div class="control-group">
            <h3>Tools</h3>
            <button class="tool-btn active" data-type="floor">Empty Floor (Eraser)</button>
            <button class="tool-btn" data-type="counter">Counter</button>
            <button class="tool-btn" data-type="stove">Stove 🔥</button>
            <button class="tool-btn" data-type="chopping">Chopping Board 🔪</button>
            <button class="tool-btn" data-type="sink">Sink 🚰</button>
            <button class="tool-btn" data-type="plates">Plates 🍽️</button>
            <button class="tool-btn" data-type="serve">Serve Window 🛎️</button>
            <button class="tool-btn" data-type="trash">Trash 🗑️</button>
            <div style="border-top:1px solid #bdc3c7; margin:5px 0;"></div>
            <button class="tool-btn" data-type="spawn_1" style="background-color:#2980b9;">Spawn P1 👤</button>
            <button class="tool-btn" data-type="spawn_2" style="background-color:#2980b9;">Spawn P2 👤</button>
            <button class="tool-btn" data-type="spawn_3" style="background-color:#2980b9;">Spawn P3 👤</button>
        </div>

        <div class="control-group">
            <label>Ingredients (Crates)</label>
            <div style="font-size: 12px; color: #f39c12; margin-bottom: 5px;">
                Tip: Place at least <b>6 crates</b> for Easy,<br>and <b>10 crates</b> for Hard/Co-op!
            </div>
            <select id="ingredient-select">
                <option value="tomato">Tomato 🍅</option>
                <option value="lettuce">Lettuce 🥬</option>
                <option value="meat">Meat 🥩</option>
                <option value="cheese">Cheese 🧀</option>
                <option value="bread">Bread 🍞</option>
                <option value="fish">Fish 🐟</option>
                <option value="rice">Rice 🍚</option>
                <option value="onion">Onion 🧅</option>
                <option value="mushroom">Mushroom 🍄</option>
                <option value="egg">Egg 🥚</option>
            </select>
            <button class="tool-btn" data-type="crate">Place Crate 📦</button>
        </div>
    </div>

    <div id="main">
        <div id="grid-container">
            <!-- Grid will be generated here -->
        </div>
    </div>

    <script src="js/admin.js"></script>

</body>

</html>
